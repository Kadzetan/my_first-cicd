name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy na serwer OVH przez SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Przygotowanie nazwy obrazu w małych literach
            # Używamy github.repository, żeby mieć pełną ścieżkę (login/nazwa-repo)
            IMAGE_PATH="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            
            # 2. Logowanie do GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Zatrzymanie starego kontenera
            docker stop my-app || true
            docker rm my-app || true

            # 4. Pobranie najnowszego obrazu (używamy zmiennej IMAGE_PATH)
            docker pull $IMAGE_PATH:latest

            # 5. Uruchomienie nowego kontenera
            docker run -d \
              --name my-app \
              --restart unless-stopped \
              -p 8${{ secrets.VPS_PORT_NUMBER }}:80 \
              $IMAGE_PATH:latest

            # 6. Czyszczenie starych, nieużywanych obrazów (opcjonalne, oszczędza miejsce na VPS)
            docker image prune -f