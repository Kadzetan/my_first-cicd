name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches: [main]

jobs:
  docker: # Usunięto nadmiarową spację przed "docker"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions: # DODANE: bez tego dostaniesz błąd "403 Forbidden" przy wysyłce
      contents: read
      packages: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v3

      - name: Ustaw nazwę obrazu na małe litery
        run: echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # POPRAWIONE: Teraz jest pod "with"

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}:latest